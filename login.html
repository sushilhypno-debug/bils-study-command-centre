<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>BILS Study Centre Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e6e9ef;--blue:#294b9b;--red:#b42318;--green:#138a5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 10px 35px #0000000d}.authbox h1{margin:0 0 10px;font-size:34px}.sub{color:var(--muted);font-size:18px;line-height:1.45;margin:0 0 24px}.hint{color:var(--muted);font-size:14px;margin:0 0 20px}.field{margin:0 0 14px}label{display:block;font-weight:600;margin-bottom:7px}input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:13px;width:100%;font-size:16px}button{border:0;border-radius:10px;padding:13px 16px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:4px}button:disabled{opacity:.6;cursor:wait}.msg{font-size:14px;margin-top:14px;color:var(--green)}.err{font-size:14px;margin-top:14px;color:var(--red)}.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none}</style></head><body><div class="auth"><div class="authbox"><h1>BILS Study Centre</h1><p class="sub">Sign in to access your personal study dashboard for Papers 1, 2, 4 and 6.</p><p class="hint">Use the email address and password provided to you.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="your@email.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><button id="loginBtn" type="submit">Sign in</button></form><div id="message"></div><a class="back" href="/">Back to BILS Study Centre</a></div></div><script>const SUPABASE_URL='https://vtizsxajygyvxdewyjcc.supabase.co';const SUPABASE_KEY='sb_publishable_V6cQGNCihIpDIBBLTeNXZw_Wha1Na9D';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.getElementById('loginForm');const btn=document.getElementById('loginBtn');const message=document.getElementById('message');function msg(text,cls){message.className=cls;message.textContent=text}form.addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password)return;btn.disabled=true;btn.textContent='Signing in...';message.textContent='';const {data,error}=await db.auth.signInWithPassword({email,password});if(error){msg('Invalid email or password. Please check your details.','err');btn.disabled=false;btn.textContent='Sign in';return}if(data.session){msg('Login successful. Opening your dashboard...','msg');window.location.replace('/');}else{msg('Unable to create a session. Please try again.','err');btn.disabled=false;btn.textContent='Sign in'}});db.auth.getSession().then(({data})=>{if(data.session)window.location.replace('/')});</script></body></html>
