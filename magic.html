<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>BILS Study Centre | Passwordless Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,sans-serif;padding:20px}.box{width:min(420px,100%);background:white;border:1px solid #e6e9ef;border-radius:22px;padding:30px;box-shadow:0 12px 40px #00000012}h1{margin:0 0 8px}.sub{color:#6b7280;line-height:1.5;margin-bottom:24px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe3ea;border-radius:10px;margin:8px 0 14px;font:inherit}button{width:100%;padding:12px;border:0;border-radius:10px;background:#294b9b;color:white;font-weight:700;font-size:15px;cursor:pointer}.msg{margin-top:14px;font-size:13px;line-height:1.5}.ok{color:#138a5b}.err{color:#b42318}.small{font-size:12px;color:#6b7280;margin-top:18px;text-align:center}</style></head><body><main class="box"><h1>BILS Study Centre</h1><p class="sub">No password needed. Enter your email and we'll send you a secure login link.</p><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="your@email.com"><button onclick="sendLink()">Send me a login link</button><div id="message" class="msg"></div><div class="small">After tapping the email link, you'll be taken to your study dashboard.</div></main><script>const SUPABASE_URL='https://vtizsxajygyvxdewyjcc.supabase.co';const SUPABASE_KEY='sb_publishable_V6cQGNCihIpDIBBLTeNXZw_Wha1Na9D';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function sendLink(){const email=document.getElementById('email').value.trim(),m=document.getElementById('message');if(!email){m.className='msg err';m.textContent='Please enter your email address.';return}m.className='msg';m.textContent='Sending...';const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://study.sushildhanawde.com/'}});if(error){m.className='msg err';m.textContent=error.message}else{m.className='msg ok';m.textContent='Login link sent. Check your email and tap the link to continue.'}}</script></body></html>
