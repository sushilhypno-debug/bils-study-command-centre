<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BILS Study Command Centre</title><style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#182230}.wrap{max-width:900px;margin:auto;padding:30px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:14px 0}h1{margin-bottom:6px}.muted{color:#6b7280}.days{font-size:42px;font-weight:800}button{padding:11px 15px;border:0;border-radius:9px;background:#244b9b;color:white;cursor:pointer}.task{padding:12px 0;border-bottom:1px solid #eee}.task:last-child{border:0}label{display:block;margin:7px 0}input{margin-right:7px}</style></head><body><div class="wrap"><h1>BILS Study Command Centre</h1><div class="muted">Papers 1, 2, 4 & 6 · Exam: 15 October 2026</div><div class="card"><div class="muted">Days remaining</div><div class="days" id="days"></div><p><b>Today's rule:</b> Study → Recall → Practice → Complete</p></div><div class="card"><h2>Today's Mission</h2><div id="today"></div></div><div class="card"><h2>27-Day Plan</h2><div id="plan"></div></div></div><script>const plan=[['18 Sep','P1','CPC: jurisdiction, institution of suits, parties/joinder','P4','Agreement for Sale of Immovable Property + Public Notice'],['19 Sep','P2','Companies Act 2013: structure, definitions, incorporation','P6','Maharashtra Public Trusts Act: Ch 1, 3, 4'],['20 Sep','P1','CPC: pleadings, plaint, written statement','P4','Accountable Receipt + TPA core principles'],['21 Sep','P6','Maharashtra Public Trusts Act: Ch 5A, 6, 7','P2','Companies Act 2013: share capital'],['22 Sep','P1','CPC: summons, appearance, discovery, inspection, documents','P4','TPA: sale, mortgage and charge'],['23 Sep','P2','Companies Act 2013: management and administration','P6','Maharashtra Public Trusts Act: Ch 10, 11, 12'],['24 Sep','P1','CPC: admissions, issues, hearing and trial','P4','TPA: lease, exchange and gift'],['25 Sep','P6','Indian Trusts Act: creation, trustees, beneficiaries, duties','P2','Companies Act 2013: directors'],['26 Sep','P1','CPC: judgment, decree and execution','P4','RERA: Chapters 1–4'],['27 Sep','REVISION','Week 1–2 revision: P1 CPC + P2 + P4 TPA + P6 Trusts. Closed-book recall + 60–90 min test.','ALL','Catch-up only, no major new topic'],['28 Sep','P2','Companies Act 2013: meetings of members and Board; Board powers','P6','Maharashtra Co-operative Societies Act: ss. 1–2, 22–35'],['29 Sep','P1','CPC: appeals, review, revision + remaining important procedure','P4','RERA: ss. 20–21, 31–40, 43–44'],['30 Sep','P6','Maharashtra Co-operative Societies Act: ss. 36–49, 91–110','P2','Companies Rules: Management & Administration + Directors'],['1 Oct','P1','Commercial Courts Act + Pleadings practical','P4','RERA: ss. 53–58 + Chapter 10'],['2 Oct','P2','Companies Rules: Board Meetings + IBC company provisions','P6','Co-operative Societies: ss. 163–164 + Ch XIA'],['3 Oct','P1','Letters Patent Clauses 12 & 15 + Constitution Arts. 32,133,134','P4','MOFA + Registration Act'],['4 Oct','REVISION','P1 weekly revision + timed answers; P4 drafting recall','ALL','Catch-up and error log'],['5 Oct','P6','Maharashtra Rent Control Act + Maharashtra Apartment Ownership Act','P2','Companies Act 1956 as in force: applicable syllabus + revision'],['6 Oct','P1','Constitution Arts. 136,141,226,227 + High Court Rules Ch IV–XIII','P4','Indian Succession Act Part VI, ss. 57–191'],['7 Oct','P6','PMLA + Arbitration & Conciliation Act','P2','Companies Act 2013 + specified Rules integrated revision'],['8 Oct','P1','High Court Rules Ch XIV–XXIV, XXVI, XXVIII','P4','Maharashtra Stamp Act Ch I–VI + specified Schedule I Articles'],['9 Oct','P6','Limitation Act + Rules of Etiquette and Professional Conduct','P4','Drafting: Conveyance + Flat purchase + Co-op flat agreement'],['10 Oct','P1','High Court Rules Ch XLII, XLIII, XLIIIA, XLVIII, XLIX, LI–LIII','P4','Drafting: Gift + Partnership + Retirement + Dissolution + LLP + Release'],['11 Oct','MOCK 1','Paper 1 full timed mock + correction','MOCK 2','Paper 2 full timed mock + correction'],['12 Oct','MOCK 3','Paper 4 full timed mock + drafting + correction','MOCK 4','Paper 6 full timed mock + correction'],['13 Oct','REVISION','P1 + P2: error logs, weak topics, key provisions and questions','ALL','No new material'],['14 Oct','REVISION','P4 + P6: error logs, drafting formats, weak topics and key provisions','ALL','Final recall. No new material']];
const key='bilsProgress';let saved=JSON.parse(localStorage.getItem(key)||'{}');function days(){let d=Math.ceil((new Date('2026-10-15')-new Date())/86400000);document.getElementById('days').textContent=Math.max(0,d)+' days'}function render(){let now=new Date();let start=new Date('2026-09-18');let i=Math.max(0,Math.min(plan.length-1,Math.floor((now-start)/86400000)));let d=plan[i];document.getElementById('today').innerHTML=`<p><b>${d[0]}</b></p><div class="task"><b>${d[1]}</b> · ${d[2]}<label><input type="checkbox" ${saved[i+'a']?'checked':''} onchange="toggle('${i}a')"> Learn / complete</label><label><input type="checkbox" ${saved[i+'b']?'checked':''} onchange="toggle('${i}b')"> Recall / practise</label></div><div class="task"><b>${d[3]}</b> · ${d[4]}</div>`;document.getElementById('plan').innerHTML=plan.map((x,j)=>`<div class="task"><b>${x[0]}</b> · ${x[1]}: ${x[2]} <span class="muted">| ${x[3]}: ${x[4]}</span></div>`).join('')}function toggle(k){saved[k]=!saved[k];localStorage.setItem(key,JSON.stringify(saved));render()}days();render();</script></body></html>
