<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>BILS Study Command Centre</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e6e9ef;--blue:#294b9b;--green:#138a5b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#111827;color:#fff;padding:22px 12px;position:fixed;inset:0 auto 0 0}.brand{font-size:18px;font-weight:800;padding:4px 12px 22px}.brand small{display:block;font-size:11px;color:#9ca3af;margin-top:5px;font-weight:500}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:10px;text-align:left;margin:3px 0;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#263247;color:white}.main{margin-left:230px;width:calc(100% - 230px);max-width:1200px;padding:30px}.sub{color:var(--muted);margin:5px 0 24px}.hero{background:linear-gradient(135deg,#111827,#294b9b);color:#fff;border-radius:20px;padding:24px;margin-bottom:18px}.hero .days{font-size:44px;font-weight:850;line-height:1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi{font-size:28px;font-weight:800}.label,.muted{font-size:12px;color:var(--muted)}.hero .muted{color:#dbe4ff}.mission{display:grid;grid-template-columns:1fr 1fr;gap:14px}.task{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}.task h3{margin:8px 0}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#31448a;font-size:11px;font-weight:800}.p2{background:#f5f3ff;color:#6d35b4}.p4{background:#ecfdf5;color:#087443}.p6{background:#fff7ed;color:#9a4f08}.progress{height:9px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--blue)}button.primary{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button.secondary{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;cursor:pointer}.check{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}.check input{width:18px;height:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.row{display:grid;grid-template-columns:100px 80px 1fr 1fr 90px;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}.row.today{background:#f7f9ff;margin:0 -18px;padding:14px 18px;border-left:4px solid var(--blue)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted)}input,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;width:100%}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 10px 35px #0000000d}.authbox h1{margin-top:0}.authbox input{margin:6px 0 10px}.msg{font-size:13px;margin:10px 0;color:var(--green)}.err{font-size:13px;margin:10px 0;color:var(--red)}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.user{font-size:12px;color:var(--muted)}@media(max-width:850px){.side{width:68px;padding:15px 7px}.brand{font-size:0;text-align:center}.brand:before{content:'B';font-size:22px}.brand small,.nav button span{display:none}.nav button{text-align:center;font-size:18px}.main{margin-left:68px;width:calc(100% - 68px);padding:18px}.cards{grid-template-columns:1fr 1fr}.mission{grid-template-columns:1fr}.row{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.hero .days{font-size:36px}h1{font-size:24px}.panel{padding:15px}.row.today{margin:0 -15px;padding:14px 15px}}

const SUPABASE_URL='https://vtizsxajygyvxdewyjcc.supabase.co';const SUPABASE_KEY='sb_publishable_V6cQGNCihIpDIBBLTeNXZw_Wha1Na9D';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let S={done:{},tr:{},mist:[],draft:{},mocks:{}};let user=null;let view='home';let saveTimer=null;
const PLAN=[['18 Sep','P1','CPC: jurisdiction, institution of suits, parties/joinder','P4','Agreement for Sale of Immovable Property + Public Notice',5.5],['19 Sep','P2','Companies Act 2013: structure, definitions, incorporation','P6','Maharashtra Public Trusts Act: Ch 1, 3, 4',5.5],['20 Sep','P1','CPC: pleadings, plaint, written statement','P4','Accountable Receipt + TPA core principles',5.5],['21 Sep','P6','Maharashtra Public Trusts Act: Ch 5A, 6, 7','P2','Companies Act 2013: share capital',5.5],['22 Sep','P1','CPC: summons, appearance, discovery, inspection, documents','P4','TPA: sale, mortgage and charge',5.5],['23 Sep','P2','Companies Act 2013: management and administration','P6','Maharashtra Public Trusts Act: Ch 10, 11, 12',5.5],['24 Sep','P1','CPC: admissions, issues, hearing and trial','P4','TPA: lease, exchange and gift',5.5],['25 Sep','P6','Indian Trusts Act: creation, trustees, beneficiaries, duties','P2','Companies Act 2013: directors',5.5],['26 Sep','P1','CPC: judgment, decree and execution','P4','RERA: Chapters 1–4',5.5],['27 Sep','REVISION','Week 1–2 revision: P1 CPC + P2 + P4 TPA + P6 Trusts. Closed-book recall + 60–90 min test.','ALL','Catch-up only, no major new topic',4.5],['28 Sep','P2','Companies Act 2013: meetings of members and Board; Board powers','P6','Maharashtra Co-operative Societies Act: ss. 1–2, 22–35',5.5],['29 Sep','P1','CPC: appeals, review, revision + remaining important procedure','P4','RERA: ss. 20–21, 31–40, 43–44',5.5],['30 Sep','P6','Maharashtra Co-operative Societies Act: ss. 36–49, 91–110','P2','Companies Rules: Management & Administration + Directors',5.5],['1 Oct','P1','Commercial Courts Act + Pleadings practical','P4','RERA: ss. 53–58 + Chapter 10',5.5],['2 Oct','P2','Companies Rules: Board Meetings + IBC company provisions','P6','Co-operative Societies: ss. 163–164 + Ch XIA',5.5],['3 Oct','P1','Letters Patent Clauses 12 & 15 + Constitution Arts. 32,133,134','P4','MOFA + Registration Act',5.5],['4 Oct','REVISION','P1 weekly revision + timed answers; P4 drafting recall','ALL','Catch-up and error log',5],['5 Oct','P6','Maharashtra Rent Control Act + Maharashtra Apartment Ownership Act','P2','Companies Act 1956 as in force: applicable syllabus + revision',5.5],['6 Oct','P1','Constitution Arts. 136,141,226,227 + High Court Rules Ch IV–XIII','P4','Indian Succession Act Part VI, ss. 57–191',5.5],['7 Oct','P6','PMLA + Arbitration & Conciliation Act','P2','Companies Act 2013 + specified Rules integrated revision',5.5],['8 Oct','P1','High Court Rules Ch XIV–XXIV, XXVI, XXVIII','P4','Maharashtra Stamp Act Ch I–VI + specified Schedule I Articles',5.5],['9 Oct','P6','Limitation Act + Rules of Etiquette and Professional Conduct','P4','Drafting: Conveyance + Flat purchase + Co-op flat agreement',5.5],['10 Oct','P1','High Court Rules Ch XLII, XLIII, XLIIIA, XLVIII, XLIX, LI–LIII','P4','Drafting: Gift + Partnership + Retirement + Dissolution + LLP + Release',5.5],['11 Oct','MOCK 1','Paper 1 full timed mock + correction','MOCK 2','Paper 2 full timed mock + correction',6],['12 Oct','MOCK 3','Paper 4 full timed mock + drafting + correction','MOCK 4','Paper 6 full timed mock + correction',6],['13 Oct','REVISION','P1 + P2: error logs, weak topics, key provisions and questions','ALL','No new material',5],['14 Oct','REVISION','P4 + P6: error logs, drafting formats, weak topics and key provisions','ALL','Final recall. No new material',5]];
const SYL={P1:['CPC, 1908','Commercial Courts Act, 2015','Pleadings','Letters Patent Clauses 12 and 15','Constitution Articles 32, 133, 134, 136, 141, 226, 227','High Court Rules (Original Side), specified chapters','Specific Relief Act, 1963'],P2:['Companies Act, 1956 as in force','Companies Act, 2013','IBC company-related provisions','Companies (Management and Administration) Rules, 2014','Companies (Appointment and Qualification of Directors) Rules, 2014','Companies (Meetings of Board and its Powers) Rules, 2014'],P4:['Drafting / Annexure 1 precedents','Transfer of Property Act, 1882','RERA, specified chapters/sections','MOFA, 1963','Registration Act, 1908','Indian Succession Act, Part VI, sections 57–191','Maharashtra Stamp Act, Chapters I–VI + specified Schedule I Articles'],P6:['Maharashtra Public Trusts Act, specified chapters','Indian Trusts Act, 1882','Maharashtra Co-operative Societies Act, specified sections','Maharashtra Rent Control Act, 1999','Maharashtra Apartment Ownership Act, 1970','Prevention of Money Laundering Act, 2002','Arbitration & Conciliation Act, 1996','Limitation Act, 1963 without Schedules','Rules of Etiquette and Professional Conduct']};
const DRAFT=['Agreement for Sale of Immovable Property','Public Notice','Accountable Receipt','Conveyance of Immovable Property','Purchase of a Flat in resale where society/company/condominium is yet to be formed','Agreement for Sale of a Flat in Co-operative Housing Society','Deed of Gift','Deed of Partnership','Deed of Partnership for Admitting a New Partner','Deed of Retirement','Deed of Dissolution of Partnership','Deed of Partnership of LLP','Deed of Release','Lease','Assignment of Lease','Surrender of Lease','Memorandum of Entry Recording Creation of Equitable Mortgage','Memorandum by Parties Recording Equitable Mortgage','Deed of English Mortgage','Deed of Re-conveyance of Mortgaged Property','Will','Codicil to Will','Revocation of Will','General Power of Attorney','Special Power of Attorney for admitting execution before Sub-Registrar','Power of Attorney to adopt and defend Legal Proceedings','Deed of Indemnity','Agreement of Leave and License','Deed of Cancellation','Deed of Rectification','Agreement of Tenancy','Agreement of Transfer of Tenancy','Surrender of Tenancy Rights','Letter of Attornment'];
function localKey(){return 'bils27v2';}function loadLocal(){try{S=JSON.parse(localStorage.getItem(localKey())||'{}')}catch(e){}S.done=S.done||{};S.tr=S.tr||{};S.mist=S.mist||[];S.draft=S.draft||{};S.mocks=S.mocks||{}}function days(){return Math.max(0,Math.ceil((new Date('2026-10-15')-new Date())/86400000))}function idx(){let a=Math.floor((new Date()-new Date('2026-09-18'))/86400000);return Math.max(0,Math.min(PLAN.length-1,a))}function tag(p){return '<span class="tag '+(p==='P2'?'p2':p==='P4'?'p4':p==='P6'?'p6':'')+'">'+p+'</span>'}function persistLocal(){localStorage.setItem(localKey(),JSON.stringify(S))}async function cloudSave(){if(!user)return;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{await db.from('student_progress').upsert({user_id:user.id,data:S},{onConflict:'user_id'})},500)}function persist(){persistLocal();cloudSave()}async function loadCloud(){if(!user)return;const {data,error}=await db.from('student_progress').select('data').eq('user_id',user.id).maybeSingle();if(!error&&data?.data){S={...S,...data.data};persistLocal()}}async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return msg('Enter email and password','err');msg('Signing in...');const {error}=await db.auth.signInWithPassword({email,password});if(error)msg(error.message,'err')}async function signUp(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return msg('Use a valid email and a password of at least 6 characters.','err');msg('Creating account...');const {data,error}=await db.auth.signUp({email,password});if(error)msg(error.message,'err');else if(data.session)start(data.session.user);else msg('Account created. Check your email to confirm your account, then sign in.')}function msg(t,c='msg'){let e=document.getElementById('message');if(e)e.className=c,e.textContent=t}function auth(){root.innerHTML='<div class="auth"><div class="authbox"><h1>BILS Study Centre</h1><p class="sub">Your personal study dashboard for Papers 1, 2, 4 and 6.</p><label>Email</label><input id="email" type="email" placeholder="your@email.com"><label>Password</label><input id="password" type="password" placeholder="At least 6 characters"><button class="primary" style="width:100%;margin-top:8px" onclick="signIn()">Sign in</button><button class="secondary" style="width:100%;margin-top:8px" onclick="signUp()">Create account</button><div id="message"></div></div></div>'}async function start(u){user=u;loadLocal();await loadCloud();render()}async function logout(){await db.auth.signOut();user=null;auth()}function home(){let i=idx(),d=PLAN[i],done=Object.values(S.done).filter(Boolean).length,total=PLAN.length*4,p=Math.round(done/total*100);return `<div class="topbar"><div><h1>Study Command Centre</h1><div class="sub">${user.email} · Cloud sync on</div></div><button class="secondary" onclick="logout()">Sign out</button></div><div class="hero"><div class="muted">BILS EXAM · 15 OCTOBER 2026</div><h1>Stay on track, not perfect.</h1><div class="days">${days()} days to go</div><p class="muted">Your progress is ${p}%. One focused day at a time.</p></div><div class="cards"><div class="card"><div class="label">Today's target</div><div class="kpi">${d[5]} hrs</div><div class="muted">Minimum 3 hrs</div></div><div class="card"><div class="label">Tasks checked</div><div class="kpi">${done}</div><div class="muted">Keep moving</div></div><div class="card"><div class="label">Mistakes logged</div><div class="kpi">${S.mist.length}</div><div class="muted">Revise twice</div></div><div class="card"><div class="label">Drafts ready</div><div class="kpi">${DRAFT.filter((_,i)=>S.draft[i+'e']).length}/${DRAFT.length}</div><div class="muted">Paper 4</div></div></div><div class="panel"><h2>Today's Mission · ${d[0]}</h2><div class="mission"><div class="task">${tag(d[1])}<h3>${d[2]}</h3><label class="check"><input type="checkbox" ${S.done[i+'a']?'checked':''} onchange="toggle('${i}a')"> Learn</label><label class="check"><input type="checkbox" ${S.done[i+'b']?'checked':''} onchange="toggle('${i}b')"> Recall</label></div><div class="task">${tag(d[3])}<h3>${d[4]}</h3><label class="check"><input type="checkbox" ${S.done[i+'c']?'checked':''} onchange="toggle('${i}c')"> Practice / Complete</label></div></div><p class="muted">Hard day? No Zero Day: 30 min study + 20 min recall + 1 question.</p></div>`}function plan(){return '<h1>Today\'s Plan</h1><div class="sub">If you miss a day, continue from where you are. Do not restart.</div><div class="panel">'+PLAN.map((d,i)=>`<div class="row ${i===idx()?'today':''}"><div><b>${d[0]}</b><div class="muted">${d[5]} hrs</div></div><div>${tag(d[1])}</div><div>${d[2]}</div><div>${tag(d[3])}<br>${d[4]}</div><div><label class="check"><input type="checkbox" ${S.done[i+'a']?'checked':''} onchange="toggle('${i}a')">Done</label><label class="check"><input type="checkbox" ${S.done[i+'b']?'checked':''} onchange="toggle('${i}b')">Recall</label></div></div>`).join('')+'</div>'}function syllabus(){let o='<h1>Syllabus Tracker</h1><div class="sub">Studied → Recalled → Practised → Exam Ready</div>';for(const p of ['P1','P2','P4','P6']){o+=`<div class="panel"><h2>${tag(p)}</h2><table><tr><th>Unit</th><th>Studied</th><th>Recalled</th><th>Practised</th><th>Exam Ready</th></tr>`;SYL[p].forEach((u,i)=>{let b=p+i;o+=`<tr><td>${u}</td>${['s','r','p','e'].map(k=>`<td><input type="checkbox" ${S.tr[b+k]?'checked':''} onchange="tr('${b+k}')"></td>`).join('')}</tr>`});o+='</table></div>'}return o}function mistakes(){return `<h1>Mistake Book</h1><div class="sub">Turn mistakes into your highest-value revision list.</div><div class="panel"><h2>+ Add Mistake</h2><div class="formgrid"><input id="mp" placeholder="Paper"><input id="mt" placeholder="Topic"><input id="mq" placeholder="Question / issue"><input id="mc" placeholder="Correct point"></div><br><button class="primary" onclick="addM()">Save mistake</button></div><div class="panel"><table><tr><th>Paper</th><th>Topic</th><th>Issue</th><th>Correct point</th><th>Revision</th></tr>${S.mist.map((m,i)=>`<tr><td>${m.p}</td><td>${m.t}</td><td>${m.q}</td><td>${m.c}</td><td><label><input type="checkbox" ${m.r1?'checked':''} onchange="rm(${i},1)"> 1</label><label><input type="checkbox" ${m.r2?'checked':''} onchange="rm(${i},2)"> 2</label></td></tr>`).join('')}</table></div>`}function drafting(){return `<h1>Drafting Bank</h1><div class="sub">Paper 4 · Read → Structure → Write → Timed → Exam Ready</div><div class="panel"><div class="kpi">${DRAFT.filter((_,i)=>S.draft[i+'e']).length} / ${DRAFT.length}</div><div class="muted">exam ready</div><div class="progress"><div class="bar" style="width:${DRAFT.filter((_,i)=>S.draft[i+'e']).length/DRAFT.length*100}%"></div></div></div><div class="panel"><table><tr><th>Precedent</th><th>Read</th><th>Structure</th><th>Written</th><th>Timed</th><th>Exam Ready</th></tr>${DRAFT.map((d,i)=>`<tr><td>${d}</td>${['r','s','w','t','e'].map(k=>`<td><input type="checkbox" ${S.draft[i+k]?'checked':''} onchange="dr('${i+k}')"></td>`).join('')}</tr>`).join('')}</table></div>`}function mocks(){return `<h1>Mock Scorecard</h1><div class="sub">Mocks diagnose weak areas. They are not a prediction of your result.</div><div class="panel"><table><tr><th>Mock</th><th>Date</th><th>Paper</th><th>Score</th><th>Time</th><th>Weak areas</th><th>Action</th></tr>${[['Mock 1','11 Oct','P1'],['Mock 2','11 Oct','P2'],['Mock 3','12 Oct','P4'],['Mock 4','12 Oct','P6']].map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><input value="${S.mocks[i]?.score||''}" onchange="sm(${i},'score',this.value)"></td><td><input value="${S.mocks[i]?.time||''}" onchange="sm(${i},'time',this.value)"></td><td><input value="${S.mocks[i]?.weak||''}" onchange="sm(${i},'weak',this.value)"></td><td><input value="${S.mocks[i]?.action||''}" onchange="sm(${i},'action',this.value)"></td></tr>`).join('')}</table></div>`}function toggle(k){S.done[k]=!S.done[k];persist();render()}function tr(k){S.tr[k]=!S.tr[k];persist();render()}function dr(k){S.draft[k]=!S.draft[k];persist();render()}function addM(){S.mist.unshift({p:mp.value,t:mt.value,q:mq.value,c:mc.value});persist();render()}function rm(i,n){S.mist[i]['r'+n]=!S.mist[i]['r'+n];persist();render()}function sm(i,k,v){S.mocks[i]=S.mocks[i]||{};S.mocks[i][k]=v;persist()}function render(){let content=view==='home'?home():view==='plan'?plan():view==='syllabus'?syllabus():view==='mistakes'?mistakes():view==='drafting'?drafting():mocks();root.innerHTML=`<div class="app"><aside class="side"><div class="brand">BILS <span>Command Centre</span><small>18 Sep → 14 Oct</small></div><nav class="nav"><button class="${view==='home'?'active':''}" onclick="view='home';render()">🏠 <span>Home</span></button><button class="${view==='plan'?'active':''}" onclick="view='plan';render()">📅 <span>Today's Plan</span></button><button class="${view==='syllabus'?'active':''}" onclick="view='syllabus';render()">✅ <span>Syllabus</span></button><button class="${view==='mistakes'?'active':''}" onclick="view='mistakes';render()">🧠 <span>Mistakes</span></button><button class="${view==='drafting'?'active':''}" onclick="view='drafting';render()">✍️ <span>Drafting</span></button><button class="${view==='mocks'?'active':''}" onclick="view='mocks';render()">📝 <span>Mocks</span></button></nav></aside><main class="main">${content}</main></div>`}loadLocal();db.auth.getSession().then(({data})=>{if(data.session)start(data.session.user);else auth()});db.auth.onAuthStateChange((_e,session)=>{if(session&&!user)start(session.user)});
</script></body></html>
